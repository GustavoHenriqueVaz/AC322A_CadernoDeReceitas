# Memoria do daemon do Gradle e do compilador Kotlin (valores seguros para maquinas com 8 GB de RAM)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX / otimizacoes de recursos
android.useAndroidX=true
android.nonTransitiveRClass=true

# Tolerancia a redes lentas ao baixar dependencias (padrao do Gradle e 30 s)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
